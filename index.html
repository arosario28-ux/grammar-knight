<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Knight</title>
<style>
  :root{
    --ink:#0b0810; --panel:#1a1420; --line:#3d2f45; --text:#f3eadf; --dim:#b8a99a;
    --gold:#ffcf4d; --good:#5ad16b; --bad:#ff5a6a; --mark:#ffcf4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--ink); color:var(--text);
    font-family:"Courier New",ui-monospace,monospace; overflow:hidden;
    -webkit-user-select:none; user-select:none;}
  #app{display:flex; flex-direction:column; align-items:center; height:100%;}
  #hud{width:min(980px,96vw); display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding:10px 4px 6px; font-weight:700; font-size:15px; flex-wrap:wrap;}
  #healthBar{position:relative; display:inline-block; width:200px; height:22px; background:#1a0000; border:2px solid #888; border-radius:3px; overflow:hidden; vertical-align:middle;}
  #healthFill{position:absolute; top:0; bottom:0; left:0; background:#cc0000; width:100%;}
  #healthText{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;}
  #strikes .x{color:var(--bad);} #strikes .o{color:#4a3a50;}
  .chip{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 12px;}
  #stage{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; position:relative;}
  canvas{display:block; border-radius:6px; box-shadow:0 0 0 2px var(--line);}
  #qpanel{width:min(980px,96vw); background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:12px 16px; margin:8px 0 12px; min-height:92px; font-size:17px; line-height:1.45;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #qpanel .tag{font-size:12px; font-weight:800; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase; font-family:"Courier New",monospace;}
  #qpanel mark{background:none; color:var(--mark); font-weight:800; text-decoration:underline;}
  #qpanel .prompt{margin-top:6px; font-weight:700; color:#fff;}
  #qpanel .blank{display:inline-block; min-width:110px; border-bottom:2px solid var(--gold); margin:0 4px;}
  #banner{position:absolute; top:18px; left:50%; transform:translateX(-50%); padding:10px 22px; border-radius:8px;
    font-weight:800; font-size:20px; pointer-events:none; text-align:center; max-width:90%;}
  #banner.good{background:#173d22; border:2px solid var(--good); color:#bff5c8;}
  #banner.bad{background:#47161d; border:2px solid var(--bad); color:#ffc9cf;}
  .hidden{display:none !important;}
  #overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#0b0810 center/cover no-repeat; overflow:auto; padding:16px;}
  #overlay.menu{background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),url(assets/img/MenuScreen.png);}
  #overlay.dead{background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),url(assets/img/DeathScreen.png);}
  #overlay.win{background-image:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)),url(assets/img/MenuScreen.png);}
  .card{background:rgba(20,14,24,.9); border:2px solid var(--line); border-radius:10px; padding:22px 26px;
    width:min(640px,94vw); max-height:100%; overflow:auto;}
  .card h1{margin:0 0 4px; font-size:42px; letter-spacing:2px; color:var(--gold); text-shadow:0 3px 0 #7a5a10;}
  .card h2{margin:0 0 8px; font-size:30px;}
  .card h3{margin:16px 0 6px; font-size:14px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim);}
  .card p,.card li{color:#e6dccf; line-height:1.5; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .card ul{padding-left:20px; margin:6px 0;}
  .key{display:inline-block; min-width:26px; padding:1px 7px; border:1px solid var(--line); border-bottom-width:3px;
    border-radius:6px; background:#2a2030; font-weight:700; font-size:13px; text-align:center;}
  .btn{margin-top:16px; font:inherit; font-weight:800; font-size:18px; padding:12px 28px; border-radius:8px; cursor:pointer;
    border:none; background:var(--gold); color:#2a1e00;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.6; cursor:wait;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; font-family:system-ui,sans-serif;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px;}
  td.ok{color:var(--good); font-weight:700;} td.no{color:var(--bad); font-weight:700;}
  .credits{font-size:13px; color:var(--dim) !important;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span id="healthBar"><span id="healthFill"></span><span id="healthText"></span></span>
    <span class="chip" id="roomChip">Question 1 / 10</span>
    <span class="chip" id="scoreChip">Score 0</span>
    <span class="chip" id="statChip"></span>
    <span class="chip" id="strikes"></span>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="banner" class="hidden"></div>
    <div id="overlay"></div>
  </div>
  <div id="qpanel"></div>
</div>

<script>
(function(){
'use strict';

/* =========================================================================
   GRAMMAR KNIGHT — a dungeon crawler that teaches English grammar.
   Purpose: entertain people while they learn English grammar.
   Graphics and sounds: from the knight-game project (assets/), MIT license.
   ========================================================================= */

/* ------------------------------ Questions -------------------------------
   Each question: n = number, s = full sentence, w = the word to highlight,
   p = the sentence to complete (____ = the blank), opts = answer choices,
   a = index of the correct choice. Only 3 choices are shown per room (the
   correct one + 2 random wrong ones), one on each door. */
const QUESTIONS = [
  // ---- Alejandro's 10 sentences go here (same format), e.g.
  // {n:1, s:"...", w:"...", p:"“...” is a/an ____.", opts:["...","...","...","..."], a:0},

  // ---- Nikita's sentences ----
  {n:11, s:"Although Elizabeth had lost her confidence, the team encouraged her to present its research to the committee, whose members praised her courage.",
   w:"Elizabeth", p:"“Elizabeth” is a/an ____.", opts:["Common noun","Proper noun","Abstract noun","Collective noun"], a:1},
  {n:12, s:"Neither of the students remembered whose notebook had been left beside the library, but someone insisted that the blue one was hers.",
   w:"Neither", p:"“Neither” is a/an ____.", opts:["Personal pronoun","Reflexive pronoun","Indefinite pronoun","Possessive pronoun"], a:2},
  {n:13, s:"The jury announced its decision after they had carefully examined the evidence, which revealed the honesty and determination of Mr. Thompson.",
   w:"jury", p:"“jury” is a/an ____.", opts:["Abstract noun","Proper noun","Collective noun","Possessive noun"], a:2},
  {n:14, s:"Those who believe that success depends entirely on wealth often forget that kindness, patience, and perseverance are qualities that distinguish them from others.",
   w:"kindness", p:"“kindness” is a/an ____.", opts:["Concrete noun","Abstract noun","Collective noun","Proper noun"], a:1},
  {n:15, s:"My brother and I visited the United Nations, where several delegates discussed freedom, equality, and peace, ideas that they believed would benefit humanity.",
   w:"peace", p:"“peace” is a/an ____.", opts:["Proper noun","Common noun","Collective noun","Abstract noun"], a:3},
  {n:16, s:"The flock scattered when it heard the farmer's voice, but those that remained near the barn continued searching for their missing young.",
   w:"farmer's", p:"“farmer's” (in “farmer's voice”) is a/an ____.", opts:["Collective noun","Possessive noun form","Abstract noun","Proper noun"], a:1},
  {n:17, s:"Whoever left these books on our desk must explain themselves, because neither of the teachers recognizes the handwriting on any of them.",
   w:"themselves", p:"“themselves” is a/an ____.", opts:["Demonstrative pronoun","Possessive pronoun","Reflexive pronoun","Interrogative pronoun"], a:2},
  {n:18, s:"Sarah's determination impressed everyone in the audience, especially those who doubted her ability to overcome failure and achieve her own goals.",
   w:"everyone", p:"“everyone” is a/an ____.", opts:["Indefinite pronoun","Personal pronoun","Relative pronoun","Demonstrative pronoun"], a:0},
  {n:19, s:"The children's excitement grew when each of them discovered that the mysterious package contained something belonging to their grandparents, including Grandmother's diary and Grandfather's photographs.",
   w:"each", p:"“each” (in “each of them”) is a/an ____.", opts:["Possessive pronoun","Indefinite pronoun","Reflexive pronoun","Interrogative pronoun"], a:1},
  {n:20, s:"What surprised Daniel most was that the committee had changed its opinion, despite his arguments and the evidence that he himself had presented in support of justice.",
   w:"What", p:"“What” (at the start of the sentence) is a/an ____.", opts:["Personal pronoun","Possessive pronoun","Interrogative pronoun","Relative pronoun"], a:2},
];

/* ------------------------------ Assets ---------------------------------- */
const assets = {
  room:        'assets/img/DungeonRoom3.png',
  roomCleared: 'assets/img/ClearedDungeonRoom3.png',
  player:      'assets/img/PlayerWalking.png',
  playerAtk:   'assets/img/PlayerAttack.png',
  slash:       'assets/img/PlayerSlash.png',
  goblin:      'assets/img/GoblinEnemy.png',
  ogre:        'assets/img/OgreEnemy.png',
  slime:       'assets/img/RedSlime.png',
  skeleton:    'assets/img/SkeletonMinion.png',
  coin:        'assets/img/CoinAnimation.png',
};
const img = {};
const imageLoads = Object.entries(assets).map(([k, src])=> new Promise(res=>{
  img[k] = new Image(); img[k].onload = res; img[k].onerror = res; img[k].src = src;
}));
const ready = im => im && im.complete && im.naturalWidth > 0;

const SOUNDS = {
  swing:'assets/snd/SwordHit.wav', hit:'assets/snd/EnemyHit.wav', kill:'assets/snd/EnemyDeath.wav',
  death:'assets/snd/PlayerDeath.wav', doors:'assets/snd/RoomCleared.wav', fade:'assets/snd/RoomFade.wav',
  coin:'assets/snd/CoinCollect.wav', buy:'assets/snd/ShopBuy.wav', fail:'assets/snd/ShopFail.wav',
};
const audioCache = {};
for(const [k, src] of Object.entries(SOUNDS)){ const a = new Audio(src); a.preload = 'auto'; audioCache[k] = a; }

/* ------------------------------ Canvas setup ---------------------------- */
// Logical room size matches the room artwork's shape (1508x1043).
const W = 960, H = 664;
const FL = 70, FR = 890, FT = 96, FB = 600;    // walkable floor bounds
const DOOR_X = [240, 480, 720], DOOR_HALF = 40;
// where the door arch sits in the room artwork (source pixels)
const DOOR_SRC_CLOSED = { x:668, y:4,  w:176, h:156 };
const DOOR_SRC_OPEN   = { x:644, y:4,  w:216, h:186 };
const DOOR_ORIG_CX = 756;                       // centre of the artwork's own door (source px)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
const stage = document.getElementById('stage');
let scale = 1, pxScale = 1;

function fit(){
  const aw = stage.clientWidth - 16, ah = stage.clientHeight - 8;
  scale = Math.max(0.3, Math.min(aw/W, ah/H));
  // cap pixel density so Retina laptops don't render 4x the pixels
  pxScale = scale * Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.style.width = Math.floor(W*scale)+'px';
  canvas.style.height = Math.floor(H*scale)+'px';
  canvas.width = Math.floor(W*pxScale);
  canvas.height = Math.floor(H*pxScale);
}
window.addEventListener('resize', fit);

/* ------------------------------ Sound ----------------------------------- */
const Snd = {
  ctx:null, out:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.out = this.ctx.createGain(); this.out.gain.value = 0.35; this.out.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  play(key, vol){
    const base = audioCache[key];
    if(!base) return;
    const a = base.cloneNode();   // clone so the same sound can overlap itself
    a.volume = vol == null ? 0.6 : vol;
    a.play().catch(()=>{});
  },
  tone(f, d, type, v, to){
    if(!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'square';
    o.frequency.setValueAtTime(f, t);
    if(to) o.frequency.exponentialRampToValueAtTime(to, t+d);
    g.gain.setValueAtTime(v||0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t+d+0.02);
  },
  seq(notes, gap, d, type, v){ notes.forEach((n,i)=> setTimeout(()=> this.tone(n,d,type,v), i*gap)); },
  swing(){ this.play('swing', 0.35); },
  hit(){ this.play('hit', 0.6); },
  kill(){ this.play('kill', 0.6); },
  hurt(){ this.tone(230,0.28,'sawtooth',0.2,70); },
  death(){ this.play('death', 0.7); },
  good(){ this.play('buy', 0.6); this.seq([523,659,784,1047],80,0.18,'triangle',0.16); },
  bad(){ this.play('fail', 0.7); this.seq([300,220,150],120,0.25,'sawtooth',0.14); },
  chest(){ this.play('buy', 0.6); setTimeout(()=> this.play('coin', 0.6), 150); },
  doors(){ this.play('doors', 0.6); },
  fade(){ this.play('fade', 0.5); },
};

/* ------------------------------ Input ----------------------------------- */
const keys = new Set();
let attackPressed = false;
window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  Snd.init();
  if(e.code==='Space' && !e.repeat) attackPressed = true;
  if(e.code==='Enter' && overlayAction){ const b = $('ovBtn'); if(b && b.disabled) return; const f = overlayAction; overlayAction = null; f(); }
});
window.addEventListener('keyup', e=> keys.delete(e.code));
window.addEventListener('blur', ()=> keys.clear());
const down = (...c)=> c.some(k=> keys.has(k));

/* ------------------------------ Helpers --------------------------------- */
const rand = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
const esc = s=> String(s).replace(/[&<>"]/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id=> document.getElementById(id);

/* ------------------------------ Game state ------------------------------ */
const MAX_WRONG = 3;
const ATK_TIME = 0.25, ATK_COOLDOWN = 0.38;
let state = 'title';   // title | fight | chest | doors | feedback | over | win
let qi = 0, wrong = 0, correct = 0, answers = [];
let player, enemies = [], particles = [], floats = [], coinsFx = [], chest = null, doors = [];
let roomKind = 'start', roomFade = 0, shake = 0, doorAnim = 0, feedbackTimer = 0, nextRoom = null;
let overlayAction = null;

const UPGRADES = [
  {name:'Sharper Sword',  desc:'+1 damage',             apply:p=>{ p.dmg++; }},
  {name:'Long Blade',     desc:'+12 reach',             apply:p=>{ p.reach += 12; }},
  {name:'Swift Boots',    desc:'+30 speed',             apply:p=>{ p.speed += 30; }},
  {name:'Heart Container',desc:'+1 max health & heal',  apply:p=>{ p.maxHp++; p.hp = p.maxHp; }},
  {name:'Healing Potion', desc:'Health fully restored', apply:p=>{ p.hp = p.maxHp; }},
];

function newPlayer(){
  return { x:W/2, y:FB-30, r:16, hp:5, maxHp:5, speed:200, dmg:1, reach:56,
           dir:'up', moving:false, atk:0, cd:0, inv:0, walk:0, kbx:0, kby:0 };
}
const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

/* ------------------------------ Enemies --------------------------------- */
// r = hitbox radius, draw = sprite size on screen
const ETYPES = {
  slime:    { hp:2, speed:110, r:13, dmg:1, draw:46, sheet:'slime'    },
  goblin:   { hp:2, speed:70,  r:15, dmg:1, draw:62, sheet:'goblin'   },
  skeleton: { hp:4, speed:110, r:15, dmg:1, draw:58, sheet:'skeleton' },
  ogre:     { hp:9, speed:68,  r:24, dmg:2, draw:96, sheet:'ogre'     },
};
function spawnEnemy(type){
  const d = ETYPES[type];
  let x, y, tries = 0;
  do { x = rand(FL+40, FR-40); y = rand(FT+40, FB-140); tries++; }
  while(Math.hypot(x-player.x, y-player.y) < 240 && tries < 30);
  enemies.push({ type, x, y, hp:d.hp, maxHp:d.hp, speed:d.speed, r:d.r, dmg:d.dmg,
                 kbx:0, kby:0, hurt:0, t:rand(0,10), spawn:0.6 });
}

/* ------------------------------ Flow ------------------------------------ */
function startGame(){
  hideOverlay();
  qi = 0; wrong = 0; correct = 0; answers = [];
  player = newPlayer();
  enterRoom('start');
}

function enterRoom(kind){
  roomKind = kind;
  player.x = W/2; player.y = FB-30; player.dir = 'up'; player.kbx = player.kby = 0;
  enemies = []; particles = []; floats = []; coinsFx = []; chest = null; doors = []; doorAnim = 0;
  roomFade = 1;
  Snd.fade();
  const lvl = Math.floor(qi/3);
  if(kind === 'chest'){
    chest = { x:W/2, y:(FT+FB)/2-20, open:false, timer:0 };
    state = 'chest';
  } else {
    let list;
    if(kind === 'hard'){
      list = ['skeleton','skeleton','skeleton','ogre'];
      for(let i=0;i<lvl;i++) list.push('skeleton');
      if(lvl >= 2) list.push('ogre');
    } else if(kind === 'easy'){
      list = lvl < 2 ? ['goblin','slime'] : ['goblin','goblin','slime'];
    } else {
      list = ['goblin','goblin','slime','slime'];
    }
    list.forEach(spawnEnemy);
    state = 'fight';
  }
  updateHUD(); updatePanel();
}

function openDoors(){
  const q = QUESTIONS[qi];
  const wrongs = shuffle(q.opts.map((_,i)=>i).filter(i=> i!==q.a)).slice(0,2);
  const picks = shuffle([q.a, ...wrongs]);
  doors = picks.map((opt,k)=> ({ x:DOOR_X[k], opt, letter:'ABC'[k] }));
  state = 'doors'; doorAnim = 0;
  Snd.doors();
  updatePanel();
}

function chooseDoor(d){
  const q = QUESTIONS[qi];
  const ok = d.opt === q.a;
  answers.push({ q, picked:d.opt, ok });
  if(ok){ correct++; Snd.good(); } else { wrong++; Snd.bad(); shake = 0.4; }
  showBanner(ok ? `✔ Correct! “${q.w}” is: ${q.opts[q.a]}` : `✘ Wrong! The answer was: ${q.opts[q.a]}`, ok);
  qi++;
  state = 'feedback'; feedbackTimer = 2.2;
  nextRoom = ()=>{
    if(wrong >= MAX_WRONG) return gameOver(`You got ${MAX_WRONG} answers wrong!`);
    if(qi >= QUESTIONS.length) return victory();
    // right answer: an easy room or a treasure chest. Wrong answer: hard enemies.
    enterRoom(ok ? (Math.random() < 0.5 ? 'chest' : 'easy') : 'hard');
  };
  updateHUD();
}

function gameOver(reason){
  state = 'over';
  showOverlay(`
    <h2 style="color:var(--bad)">Game Over</h2>
    <p>${esc(reason)} The dungeon resets and you start again from the first door.</p>
    <p>Score: <b>${correct}</b> correct, <b>${wrong}</b> wrong.</p>
    ${reviewTable()}
    <button class="btn" id="ovBtn">Restart (Enter)</button>`, startGame, 'dead');
}

function victory(){
  state = 'win';
  showOverlay(`
    <h2 style="color:var(--gold)">Victory! 🏆</h2>
    <p>You escaped the dungeon. Final score: <b>${correct} / ${QUESTIONS.length}</b></p>
    ${reviewTable()}
    <button class="btn" id="ovBtn">Play Again (Enter)</button>`, startGame, 'win');
}

function reviewTable(){
  if(!answers.length) return '';
  return `<table><tr><th>Question</th><th>Your answer</th><th>Correct answer</th></tr>${
    answers.map(a=> `<tr><td>${a.q.n}. “${esc(a.q.w)}”</td><td class="${a.ok?'ok':'no'}">${esc(a.q.opts[a.picked])}</td><td>${esc(a.q.opts[a.q.a])}</td></tr>`).join('')
  }</table>`;
}

function titleScreen(){
  state = 'title';
  showOverlay(`
    <h1>GRAMMAR KNIGHT</h1>
    <p>Fight your way through the dungeon and pick the right door to learn English grammar!</p>
    <h3>How to play</h3>
    <ul>
      <li>Use the <span class="key">←</span> <span class="key">↑</span> <span class="key">→</span> <span class="key">↓</span> arrow keys to move your knight.</li>
      <li>Press <span class="key">Space</span> to attack the enemies.</li>
      <li>Once you defeat all the enemies, 3 doors open. Read the sentence and walk through the door with the correct answer.</li>
      <li><b style="color:var(--good)">Right answer:</b> easy enemies, or a treasure chest with an upgrade.</li>
      <li><b style="color:var(--bad)">Wrong answer:</b> difficult enemies. ${MAX_WRONG} wrong answers and the game restarts!</li>
    </ul>
    <h3>Credits</h3>
    <p class="credits">Developers: Nico (Alejandro), Nikita, Sebastian<br>Code: Nico &nbsp;·&nbsp; Sentences: Nikita, Alejandro<br>Graphics &amp; sounds: knight-game by thestrongestcode</p>
    <button class="btn" id="ovBtn" disabled>Loading…</button>`, startGame, 'menu');
  Promise.all(imageLoads).then(()=>{
    const b = $('ovBtn');
    if(b && state === 'title'){ b.disabled = false; b.textContent = 'Start (Enter)'; }
  });
  updatePanel();
}

/* ------------------------------ DOM UI ---------------------------------- */
let bannerTimer = null;
function showBanner(text, ok){
  const b = $('banner');
  b.textContent = text; b.className = ok ? 'good' : 'bad';
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=> b.classList.add('hidden'), 2400);
}
function showOverlay(html, action, look){
  const o = $('overlay');
  o.className = look || '';
  o.innerHTML = `<div class="card">${html}</div>`;
  overlayAction = action;
  const btn = $('ovBtn');
  if(btn) btn.addEventListener('click', ()=>{ if(btn.disabled) return; Snd.init(); overlayAction = null; action(); });
}
function hideOverlay(){ $('overlay').classList.add('hidden'); overlayAction = null; }

function updateHUD(){
  if(!player){ $('healthText').textContent = ''; return; }
  $('healthFill').style.width = (100*Math.max(0,player.hp)/player.maxHp) + '%';
  $('healthText').textContent = `${Math.max(0,player.hp)} / ${player.maxHp}`;
  $('roomChip').textContent = `Question ${Math.min(qi+1, QUESTIONS.length)} / ${QUESTIONS.length}`;
  $('scoreChip').textContent = `Score ${correct}`;
  $('statChip').textContent = `ATK ${player.dmg} · SPD ${player.speed}`;
  let s = 'Wrong: ';
  for(let i=0;i<MAX_WRONG;i++) s += i < wrong ? '<span class="x">✘</span>' : '<span class="o">●</span>';
  $('strikes').innerHTML = s;
}

function highlighted(q){
  // highlight the first whole-word match of the target word in the sentence
  const re = new RegExp('(^|[^A-Za-z\'])(' + q.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?![A-Za-z])');
  return esc(q.s).replace(re, (m, pre, word)=> pre + '<mark>' + word + '</mark>');
}
function promptHtml(q){ return esc(q.p).replace('____', '<span class="blank"></span>'); }
function updatePanel(){
  const p = $('qpanel');
  if(state === 'title' || !player){ p.innerHTML = '<span class="tag">Grammar Knight</span><div>Press Start to enter the dungeon.</div>'; return; }
  const q = QUESTIONS[Math.min(qi, QUESTIONS.length-1)];
  if(state === 'fight'){
    p.innerHTML = `<span class="tag">${roomKind==='hard' ? '⚠ Hard room' : roomKind==='easy' ? 'Easy room' : 'Room 1'} — defeat all the enemies to open the doors</span>
      <div>${highlighted(q)}</div>`;
  } else if(state === 'chest'){
    p.innerHTML = `<span class="tag">💰 Treasure room — walk into the chest to open it</span><div>${highlighted(q)}</div>`;
  } else if(state === 'doors'){
    p.innerHTML = `<span class="tag">Question ${q.n} — walk through the door with the correct answer</span>
      <div>${highlighted(q)}</div><div class="prompt">Complete the sentence: ${promptHtml(q)}</div>`;
  }
}

/* ------------------------------ Particles ------------------------------- */
function burst(x, y, n, color, speed, life){
  for(let i=0;i<n;i++){
    const a = rand(0, Math.PI*2), s = speed*rand(0.3,1);
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life*rand(0.6,1.2), max:life, color, size:rand(2,5) });
  }
  if(particles.length > 300) particles.splice(0, particles.length-300);
}
function floatText(x, y, text, color){ floats.push({ x, y, text, color, life:1.6 }); }

/* ------------------------------ Update ---------------------------------- */
function update(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles[i] = particles[particles.length-1]; particles.pop(); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 1-3*dt; p.vy *= 1-3*dt;
  }
  for(let i=coinsFx.length-1;i>=0;i--){
    const c = coinsFx[i];
    c.t += dt; c.x += c.vx*dt; c.y += c.vy*dt; c.vy += 500*dt;
    if(c.t > 1) coinsFx.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){ floats[i].life -= dt; floats[i].y -= 30*dt; if(floats[i].life<=0) floats.splice(i,1); }
  roomFade = Math.max(0, roomFade - dt*2.5);
  shake = Math.max(0, shake - dt);
  if(state === 'doors') doorAnim = Math.min(1, doorAnim + dt*1.6);

  if(state === 'feedback'){
    feedbackTimer -= dt;
    if(feedbackTimer <= 0 && nextRoom){ const f = nextRoom; nextRoom = null; f(); }
    attackPressed = false;
    return;
  }
  if(state !== 'fight' && state !== 'chest' && state !== 'doors'){ attackPressed = false; return; }

  updatePlayer(dt);
  if(state === 'fight') updateEnemies(dt);

  if(state === 'chest' && chest){
    if(!chest.open && Math.hypot(player.x-chest.x, player.y-chest.y) < 48){
      chest.open = true; chest.timer = 1.4;
      const up = UPGRADES[Math.floor(Math.random()*UPGRADES.length)];
      up.apply(player);
      Snd.chest();
      for(let i=0;i<12;i++) coinsFx.push({ x:chest.x, y:chest.y-10, vx:rand(-160,160), vy:rand(-380,-200), t:0 });
      floatText(chest.x, chest.y-56, `${up.name}! ${up.desc}`, '#ffcf4d');
      updateHUD();
    }
    if(chest.open){ chest.timer -= dt; if(chest.timer <= 0 && state === 'chest') openDoors(); }
  }
}

function updatePlayer(dt){
  const p = player;
  let mx = (down('ArrowRight','KeyD')?1:0) - (down('ArrowLeft','KeyA')?1:0);
  let my = (down('ArrowDown','KeyS')?1:0) - (down('ArrowUp','KeyW')?1:0);
  p.moving = !!(mx || my);
  if(p.moving){
    // the sprite faces one of 4 directions
    if(my) p.dir = my < 0 ? 'up' : 'down';
    if(mx && !my) p.dir = mx < 0 ? 'left' : 'right';
    const l = Math.hypot(mx,my); mx/=l; my/=l;
    p.walk += dt;
  }
  p.x += (mx*p.speed + p.kbx)*dt;
  p.y += (my*p.speed + p.kby)*dt;
  p.kbx *= Math.exp(-10*dt); p.kby *= Math.exp(-10*dt);

  p.x = clamp(p.x, FL+p.r, FR-p.r);
  p.y = Math.min(p.y, FB-p.r);
  if(p.y < FT+p.r){
    const d = state === 'doors' && doorAnim > 0.6 ? doors.find(d=> Math.abs(p.x-d.x) < DOOR_HALF) : null;
    if(d){
      p.x = clamp(p.x, d.x-DOOR_HALF+p.r*0.6, d.x+DOOR_HALF-p.r*0.6);
      if(p.y < FT-14){ chooseDoor(d); return; }
    } else {
      p.y = FT+p.r;
    }
  }

  p.inv = Math.max(0, p.inv-dt);
  p.cd = Math.max(0, p.cd-dt);
  p.atk = Math.max(0, p.atk-dt);
  if(attackPressed && p.cd <= 0){
    p.atk = ATK_TIME; p.cd = ATK_COOLDOWN;
    Snd.swing();
    swordHit();
  }
  attackPressed = false;
}

function swordHit(){
  const p = player, [fx, fy] = DIRV[p.dir];
  for(const e of enemies){
    if(e.spawn > 0) continue;
    const dx = e.x-p.x, dy = e.y-p.y, dist = Math.hypot(dx,dy);
    if(dist > p.reach + e.r) continue;
    const dot = (dx*fx + dy*fy) / (dist||1);
    if(dot < 0.3 && dist > p.r+e.r+6) continue;   // must be roughly in front (unless touching)
    e.hp -= p.dmg; e.hurt = 0.18;
    const kb = e.type === 'ogre' ? 160 : 340;
    e.kbx = dx/(dist||1)*kb; e.kby = dy/(dist||1)*kb;
    Snd.hit();
    burst(e.x, e.y, 8, '#fff', 180, 0.3);
  }
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.hp > 0) continue;
    const col = {slime:'#d84040', goblin:'#7fae4a', skeleton:'#e8e2d0', ogre:'#6f7a3c'}[e.type];
    burst(e.x, e.y, 22, col, 240, 0.6);
    Snd.kill();
    enemies.splice(i,1);
  }
  if(state === 'fight' && enemies.length === 0) openDoors();
}

function updateEnemies(dt){
  const p = player;
  for(const e of enemies){
    e.t += dt;
    if(e.spawn > 0){ e.spawn -= dt; continue; }
    e.hurt = Math.max(0, e.hurt-dt);
    let dx = p.x-e.x, dy = p.y-e.y;
    const dist = Math.hypot(dx,dy) || 1;
    dx /= dist; dy /= dist;
    let sp = e.speed;
    if(e.type === 'slime') sp *= 0.35 + Math.abs(Math.sin(e.t*4));   // hops
    // keep enemies from stacking on top of each other
    for(const o of enemies){
      if(o === e) continue;
      const ox = e.x-o.x, oy = e.y-o.y, od = Math.hypot(ox,oy);
      if(od > 0 && od < e.r+o.r+4){ dx += ox/od*0.8; dy += oy/od*0.8; }
    }
    e.x += (dx*sp + e.kbx)*dt;
    e.y += (dy*sp + e.kby)*dt;
    e.kbx *= Math.exp(-8*dt); e.kby *= Math.exp(-8*dt);
    e.x = clamp(e.x, FL+e.r, FR-e.r);
    e.y = clamp(e.y, FT+e.r, FB-e.r);

    if(p.inv <= 0 && Math.hypot(p.x-e.x, p.y-e.y) < p.r+e.r-2){
      p.hp -= e.dmg; p.inv = 1.0; shake = 0.25;
      p.kbx = (p.x-e.x)/dist*420; p.kby = (p.y-e.y)/dist*420;
      Snd.hurt();
      burst(p.x, p.y, 12, '#ff4d6a', 200, 0.4);
      updateHUD();
      if(p.hp <= 0){
        Snd.death();
        state = 'feedback'; feedbackTimer = 0.9;
        nextRoom = ()=> gameOver('Your knight was defeated!');
        return;
      }
    }
  }
}

/* ------------------------------ Drawing --------------------------------- */
const SX = W / 1508, SY = H / 1043;   // room artwork pixels -> logical units

function drawRoom(){
  if(ready(img.room)) ctx.drawImage(img.room, 0, 0, W, H);
  else { ctx.fillStyle = '#1a1420'; ctx.fillRect(0, 0, W, H); }
}

// The artwork only has one door, so the door arch is cut out of the room
// image (closed) and the cleared-room image (open) and drawn at each spot.
function drawDoors(){
  const open = (state === 'doors' || (state === 'feedback' && doors.length)) ? doorAnim : 0;
  for(const x of DOOR_X){
    const off = x - DOOR_ORIG_CX*SX;
    const c = DOOR_SRC_CLOSED, o = DOOR_SRC_OPEN;
    if(ready(img.room)) ctx.drawImage(img.room, c.x, c.y, c.w, c.h, c.x*SX+off, c.y*SY, c.w*SX, c.h*SY);
    if(open > 0 && ready(img.roomCleared)){
      ctx.globalAlpha = open;
      ctx.drawImage(img.roomCleared, o.x, o.y, o.w, o.h, o.x*SX+off, o.y*SY, o.w*SX, o.h*SY);
      ctx.globalAlpha = 1;
    }
  }
  if(doors.length){
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(const d of doors){
      ctx.fillStyle = '#000'; ctx.fillText(d.letter, d.x+2, 14);
      ctx.fillStyle = '#ffcf4d'; ctx.fillText(d.letter, d.x, 12);
    }
  }
}

function drawDoorLabels(){
  if(!doors.length || state !== 'doors') return;
  ctx.globalAlpha = Math.min(1, doorAnim*1.5);
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const q = QUESTIONS[qi];
  for(const d of doors){
    const text = `${d.letter}. ${q.opts[d.opt]}`;
    const w = Math.min(230, ctx.measureText(text).width + 24);
    ctx.fillStyle = 'rgba(10,6,12,0.85)';
    roundRect(d.x-w/2, FT+16, w, 32, 6); ctx.fill();
    ctx.strokeStyle = '#ffcf4d'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText(text, d.x, FT+32, 216);
    ctx.fillStyle = 'rgba(255,207,77,0.8)';
    ctx.beginPath(); ctx.moveTo(d.x, FT+6); ctx.lineTo(d.x-7, FT+14); ctx.lineTo(d.x+7, FT+14); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function shadow(x, y, rx){
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, rx*0.35, 0, 0, Math.PI*2); ctx.fill();
}

// Player sheets: 4 columns x 4 rows of 300px frames, rows = down, left, right, up
const PLAYER_FRAME = 300, PLAYER_ROW = { down:0, left:1, right:2, up:3 };
const PLAYER_DRAW = 64;
const SLASH_FRAMES = 4, SLASH_ROT = { right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2 };

function drawKnight(p){
  shadow(p.x, p.y+PLAYER_DRAW*0.4, 16);
  if(p.inv > 0 && Math.floor(p.inv*16) % 2 === 0) ctx.globalAlpha = 0.4;
  const row = PLAYER_ROW[p.dir];
  const attacking = p.atk > 0;
  const sheet = attacking ? img.playerAtk : img.player;
  const frame = attacking ? Math.min(2, Math.floor((1 - p.atk/ATK_TIME)*3))
                          : (p.moving ? Math.floor(p.walk*8) % 4 : 0);
  if(ready(sheet)){
    ctx.drawImage(sheet, frame*PLAYER_FRAME, row*PLAYER_FRAME, PLAYER_FRAME, PLAYER_FRAME,
      Math.round(p.x-PLAYER_DRAW/2), Math.round(p.y-PLAYER_DRAW/2), PLAYER_DRAW, PLAYER_DRAW);
  } else {
    ctx.fillStyle = 'slategray'; ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2);
  }
  ctx.globalAlpha = 1;
  // slash effect in front of the knight, rotated to the facing direction
  if(attacking && ready(img.slash)){
    const fw = img.slash.naturalWidth / SLASH_FRAMES, fh = img.slash.naturalHeight;
    const sf = Math.min(SLASH_FRAMES-1, Math.floor((1 - p.atk/ATK_TIME)*SLASH_FRAMES));
    const size = p.reach*1.35;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(SLASH_ROT[p.dir]);
    ctx.drawImage(img.slash, sf*fw, 0, fw, fh, p.reach*0.55 - size/2, -size/2, size, size);
    ctx.restore();
  }
}

// Enemy sheets: 4 frames in one row, sprites face right (flipped to face left)
function drawEnemy(e){
  const d = ETYPES[e.type], sheet = img[d.sheet];
  const sp = e.spawn > 0 ? 1 - e.spawn/0.6 : 1;
  shadow(e.x, e.y+d.draw*0.36, d.draw*0.3);
  ctx.globalAlpha = sp * (e.hurt > 0 && Math.floor(e.hurt*30)%2===0 ? 0.35 : 1);
  if(ready(sheet)){
    const fw = sheet.naturalWidth/4, fh = sheet.naturalHeight;
    const frame = Math.floor(e.t * (e.type==='ogre' ? 5 : 7)) % 4;
    ctx.save();
    ctx.translate(e.x, e.y);
    if(player.x < e.x) ctx.scale(-1, 1);
    ctx.drawImage(sheet, frame*fw, 0, fw, fh, -d.draw/2, -d.draw/2, d.draw, d.draw);
    ctx.restore();
  } else {
    ctx.fillStyle = 'crimson'; ctx.fillRect(e.x-e.r, e.y-e.r, e.r*2, e.r*2);
  }
  ctx.globalAlpha = 1;
  if(e.hp < e.maxHp){
    const w = Math.max(30, e.r*2);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(e.x-w/2, e.y-d.draw/2-8, w, 5);
    ctx.fillStyle = '#cc0000'; ctx.fillRect(e.x-w/2, e.y-d.draw/2-8, w*Math.max(0,e.hp/e.maxHp), 5);
  }
}

function drawChest(c){
  shadow(c.x, c.y+20, 30);
  // wooden chest in the same dark-dungeon palette as the room art
  ctx.fillStyle = '#4a2a14'; ctx.fillRect(c.x-28, c.y-6, 56, 28);
  ctx.fillStyle = '#6b4423'; ctx.fillRect(c.x-26, c.y-4, 52, 24);
  ctx.fillStyle = '#3a3a44'; ctx.fillRect(c.x-28, c.y+4, 56, 4);
  ctx.fillRect(c.x-20, c.y-6, 4, 28); ctx.fillRect(c.x+16, c.y-6, 4, 28);
  if(c.open){
    ctx.fillStyle = 'rgba(255,210,90,0.35)';
    ctx.beginPath(); ctx.arc(c.x, c.y-10, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a2a14'; ctx.fillRect(c.x-28, c.y-30, 56, 14);
  } else {
    const bob = Math.sin(performance.now()/300)*3;
    ctx.fillStyle = '#5a3418'; ctx.fillRect(c.x-28, c.y-20, 56, 16);
    ctx.fillStyle = '#3a3a44'; ctx.fillRect(c.x-20, c.y-20, 4, 16); ctx.fillRect(c.x+16, c.y-20, 4, 16);
    ctx.fillStyle = '#ffcf4d'; ctx.fillRect(c.x-5, c.y-10, 10, 12);
    if(ready(img.coin)) ctx.drawImage(img.coin, c.x-14, c.y-62+bob, 28, 28);
  }
}

function render(){
  const sx = shake > 0 ? rand(-1,1)*shake*16 : 0, sy = shake > 0 ? rand(-1,1)*shake*16 : 0;
  ctx.setTransform(pxScale,0,0,pxScale, sx*pxScale, sy*pxScale);

  drawRoom();
  drawDoors();
  if(!player) return;
  if(roomKind === 'hard' && state === 'fight'){ ctx.fillStyle = 'rgba(140,0,0,0.12)'; ctx.fillRect(0,0,W,H); }
  drawDoorLabels();
  if(chest) drawChest(chest);

  // draw everything sorted by y for depth
  const list = enemies.slice();
  if(state !== 'over' && state !== 'win') list.push(player);
  list.sort((a,b)=> a.y-b.y);
  for(const o of list) (o === player ? drawKnight(o) : drawEnemy(o));

  if(ready(img.coin)) for(const c of coinsFx){
    ctx.globalAlpha = Math.max(0, 1-c.t);
    ctx.drawImage(img.coin, c.x-11, c.y-11, 22, 22);
  }
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 18px "Courier New", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const f of floats){
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#000'; ctx.fillText(f.text, f.x+2, f.y+2);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if(roomFade > 0){ ctx.fillStyle = `rgba(0,0,0,${roomFade})`; ctx.fillRect(-20,-20,W+40,H+40); }
}

/* ------------------------------ Main loop ------------------------------- */
// Fixed-size physics steps: the game runs at the same speed on every
// computer, whether the screen draws 30, 60 or 120 frames per second.
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now-last)/1000);
  last = now;
  const steps = Math.max(1, Math.ceil(dt/(1/60) - 1e-6));
  for(let i=0;i<steps;i++) update(dt/steps);
  render();
}

fit();
updateHUD();
titleScreen();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
